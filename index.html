  <title>WIRE · Options Desk</title>

  <div id="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <div class="brand-text">
          <span class="brand-name">WIRE</span>
          <span class="brand-sub">options desk</span>
        </div>
      </div>

      <div class="clocks">
        <div class="clock" id="clock-local">
          <span class="clock-label">Local</span>
          <span class="clock-time">--:--:-- --</span>
        </div>
        <div class="clock" id="clock-utc">
          <span class="clock-label">UTC</span>
          <span class="clock-time">--:--:-- --</span>
        </div>
      </div>

      <div class="sessions" id="sessions">
        <span class="session" data-session="asia">Asia</span>
        <span class="session" data-session="europe">Europe</span>
        <span class="session" data-session="us">US</span>
      </div>

      <div class="top-meta">
        <span class="last-refresh" id="last-refresh">Last —</span>
        <span class="status-pill" id="data-status">—</span>
        <button type="button" class="btn-refresh" id="btn-refresh" title="Refresh">
          Refresh
        </button>
      </div>
    </header>

    <section class="indices-strip" id="indices-strip" aria-label="Major indices"></section>
    <section class="futures-strip" aria-label="Futures and rates">
      <div class="strip-label">Futures</div>
      <div class="futures-track" id="futures-body">
        <div class="loading-row">Loading…</div>
      </div>
      <span class="panel-badge" id="futures-badge">—</span>
    </section>

    <main class="main-grid">
      <section class="card spike-card">
        <div class="card-head">
          <div>
            <h2><span class="chan spike">#spike</span> Movers</h2>
            <p class="card-hint" id="spike-hint">3%+ in 1m · liquid names</p>
          </div>
          <span class="panel-badge" id="spike-badge">—</span>
        </div>
        <div class="card-body" id="spike-body">
          <div class="loading-row">Loading…</div>
        </div>
      </section>

      <section class="card news-card">
        <div class="card-head">
          <div>
            <h2><span class="chan newswire">#newswire</span> Breaks</h2>
            <p class="card-hint">Earnings · CEO · M&amp;A · FDA · geo · <span class="chan fed inline">#fed</span></p>
          </div>
          <span class="panel-badge" id="news-badge">—</span>
        </div>
        <div class="news-filters">
          <button type="button" class="filter active" data-filter="all">All</button>
          <button type="button" class="filter" data-filter="macro">Macro</button>
          <button type="button" class="filter" data-filter="equities">EQ</button>
          <button type="button" class="filter" data-filter="geo">Geo</button>
          <button type="button" class="filter" data-filter="critical">Crit</button>
        </div>
        <div class="card-body news-body" id="news-body"></div>
      </section>

      <aside class="card watch-card">
        <div class="card-head">
          <div>
            <h2>Watch</h2>
            <p class="card-hint">Catalysts on deck</p>
          </div>
        </div>
        <div class="card-body" id="watch-body"></div>
      </aside>
    </main>

    <footer class="status-bar">
      <span>Calls / puts off news + tape</span>
      <span id="footer-hint">Polling relative data/*.json</span>
      <span id="footer-clock">—</span>
    </footer>
  </div>
