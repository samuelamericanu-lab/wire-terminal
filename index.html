<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wire Terminal</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark">■</span>
        <span class="brand-name">WIRE</span>
        <span class="brand-sub">TERMINAL</span>
      </div>

      <div class="clocks">
        <div class="clock" id="clock-local">
          <span class="clock-label">LOCAL</span>
          <span class="clock-time">--:--:--</span>
        </div>
        <div class="clock" id="clock-utc">
          <span class="clock-label">UTC</span>
          <span class="clock-time">--:--:--</span>
        </div>
      </div>

      <div class="sessions" id="sessions">
        <span class="session" data-session="asia">ASIA</span>
        <span class="session" data-session="europe">EUROPE</span>
        <span class="session" data-session="us">US</span>
      </div>

      <div class="top-meta">
        <span class="last-refresh" id="last-refresh">LAST —</span>
        <button type="button" class="btn-refresh" id="btn-refresh" title="Refresh data">
          <span class="btn-icon">↻</span> REFRESH
        </button>
        <span class="status-pill" id="data-status" title="Market data status">—</span>
      </div>
    </header>

    <!-- INDICES STRIP -->
    <section class="indices-strip" id="indices-strip" aria-label="Major indices">
      <!-- Filled by JS -->
    </section>

    <!-- MAIN GRID -->
    <main class="main-grid">
      <!-- LEFT: Futures -->
      <aside class="panel futures-panel">
        <div class="panel-header">
          <h2>FUTURES / RATES</h2>
          <span class="panel-badge" id="futures-badge">—</span>
        </div>
        <div class="panel-body" id="futures-body">
          <div class="loading-row">Loading…</div>
        </div>
      </aside>

      <!-- CENTER: News Wire -->
      <section class="panel news-panel">
        <div class="panel-header">
          <h2>NEWS WIRE</h2>
          <span class="panel-badge" id="news-badge">SEED</span>
        </div>
        <div class="news-filters">
          <button type="button" class="filter active" data-filter="all">ALL</button>
          <button type="button" class="filter" data-filter="macro">MACRO</button>
          <button type="button" class="filter" data-filter="equities">EQUITIES</button>
          <button type="button" class="filter" data-filter="futures">FUTURES</button>
        </div>
        <div class="panel-body news-body" id="news-body">
          <!-- Seed / live flashes -->
        </div>
      </section>

      <!-- RIGHT: Watch Next -->
      <aside class="panel watch-panel">
        <div class="panel-header">
          <h2>WATCH NEXT</h2>
          <span class="panel-badge amber">CATALYSTS</span>
        </div>
        <div class="panel-body" id="watch-body">
          <!-- Static catalysts + calendar-ish items -->
        </div>
      </aside>
    </main>

    <footer class="status-bar">
      <span>WIRE TERMINAL · MARKETS DESK</span>
      <span id="footer-hint">Auto-refresh ~45s · Free public APIs · See README</span>
      <span id="footer-clock">—</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
